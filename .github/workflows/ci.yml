name: CI

on:
  pull_request:
  push:
    branches: [main]

# Quyền mặc định tối thiểu; job nào cần thêm thì tự khai báo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Firebase CLI (pinned) cho Emulator
        run: npm install -g firebase-tools@15.34.2
      - run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm run test:unit
      - name: Firestore Rules + integration tests (Emulator, project demo-*)
        run: npm run test:rules
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: E2E trên Chrome thật + Emulator (Auth, Firestore)
        run: npm run test:e2e
        env:
          E2E_CHANNEL: chrome
